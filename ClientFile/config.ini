[AutoPot]
; Auto-pocion del cliente de PRUEBAS de balance. Solo se activa si el
; ejecutable se llama MainEdit.exe: en Main.exe queda desarmado siempre,
; aunque Enable valga 1. Sirve para medir dano en PvP sin dos personas.
; Enable     0=apagado 1=encendido
; HpPercent  bebe cuando la vida baja de este % (1-100)
; IntervalMs ms entre pociones. El servidor rechaza por debajo de 500 en
;            ventana PvP (CheckAutoPotionHackTolerance), asi que 550 deja
;            margen y reproduce el techo de un jugador humano.
