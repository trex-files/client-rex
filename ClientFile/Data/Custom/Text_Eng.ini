[Text_InfoDW]
Text0 = "About the Dark Wizard"
Text1 = "Some humans strive for great physical strength,"
Text2 = "while others bend the laws of nature to their advantage."
Text3 = "The Dark Wizard uses arcane spells to attack his enemies."
Text4 = "In addition, he can call upon mysterious spirits"
Text5 = "for aid. Everyone fears his magical power,"
Text6 = "so the Dark Wizard often lives alone. However,"
Text7 = "his frail appearance can mislead those who underestimate him."
Text8 = "Do not be fooled. Many warriors have been"
Text9 = "engulfed in flame before they ever reached the Wizard."
Text10 = "The Dark Wizard has his own list of offensive spells."
Text11 = "Though powerful, many require a long cast time"
Text12 = "and consume vast amounts of mana to execute."
[Text_InfoDK]
Text0 = "About the Dark Knight"
Text1 = "The Dark Knight embodies strength and power."
Text2 = "In fierce battles, they can slay characters"
Text3 = "of other classes even while gravely wounded."
Text4 = "Thanks to outstanding survivability, the Dark Knight"
Text5 = "can adventure alone without much trouble."
Text6 = "He can wear many kinds of armor"
Text7 = "and wield weapons such as swords, maces or spears."
Text8 = "The Dark Knight's skills cost very little mana,"
Text9 = "which is why he is often chosen by new players."
Text10 = "In addition, the Dark Knight gains unique skills"
Text11 = "when mounted on a Dark Horse."
[Text_InfoELF]
Text0 = "About the Fairy Elf"
Text1 = "The Fairy Elves of Noria belong to the most ancient bloodlines."
Text2 = "They claim to be the first race of MU, predating even humans."
Text3 = "A Noria Elf has said their kind possesses an ethereal beauty."
Text4 = "Though they appear to avoid battle, do not assume"
Text5 = "they are timid. The Elves taught humans"
Text6 = "the art of the bow. No one can defeat an Elf"
Text7 = "in an archery duel. The Fairy Elves of Noria"
Text8 = "also hold pacts with other races,"
Text9 = "and those pacts have drawn them into many wars."
[Text_InfoMG]
Text0 = "About the Magic Gladiator"
Text1 = "The Magic Gladiator can use many of the skills of both the Dark Knight and the Dark Wizard."
Text2 = "Though his combat and magic skills are not as perfected as"
Text3 = "those of a pure Dark Knight or Dark Wizard, this combination makes him"
Text4 = "the most versatile of all character classes."
Text5 = "The Magic Gladiator can unleash decisive blows,"
Text6 = "wield powerful equipment and enter areas"
Text7 = "with lower level requirements than the other classes."
Text8 = "He also holds pacts with other races."
Text9 = "To create a Magic Gladiator you must reach level 220."
[Text_InfoDL]
Text0 = "About the Dark Lord"
Text1 = "The Dark Lord wields his sword with the authority of a true leader"
Text2 = "in battle. He can summon the Raven and the Dark Horse"
Text3 = "to crush his foes. Like the Magic Gladiator, he can enter"
Text4 = "many regions and wear fine equipment with"
Text5 = "lower level requirements than most classes."
Text6 = "He also commands new spells and techniques never before"
Text7 = "seen on the continent of MU. Finally, to create a Dark Lord"
Text8 = "you must reach level 250."
[Text_InfoSUM]
Text0 = "About the Summoner"
Text1 = "The Summoner was born in Elbeland, the village of recluses"
Text2 = "in the southwestern part of the MU continent."
Text3 = "According to ancient legend, this is home to people with"
Text4 = "supernatural gifts, highly sensitive souls who communicate"
Text5 = "with spirits of the dead. Because of their origin,"
Text6 = "the Summoner inherits all the spells of her ancestors."
Text7 = "She also has the power to drain life and call upon spirits"
Text8 = "to aid her in battle. Enemies struck by these spirits"
Text9 = "become cursed and lose a large portion of their HP."
[Text_InfoRF]
Text0 = "About the Rage Fighter"
Text1 = "The Rage Fighter is a descendant of the Royal Knights legion"
Text2 = "of the Kingdom of Kalrutan. The Rage Fighter has mastered"
Text3 = "the art of using his body itself as his greatest weapon."
Text4 = "With swift movement and surprise strikes,"
Text5 = "the Rage Fighter forces his opponent into a defensive stance"
Text6 = "and takes them down swiftly"
Text7 = "with his massive frame. He can also"
Text8 = "eliminate enemies from afar with devastating damage"
Text9 = "drawn from his own life force."
